<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 언어 웹 컴파일러 & 다운로드</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1e1e1e; color: #fff; }
        textarea { width: 100%; height: 200px; background: #2d2d2d; color: #00ff66; font-family: monospace; padding: 10px; }
        .btn { padding: 10px 20px; background: #007acc; color: white; border: none; cursor: pointer; margin-right: 10px; font-weight: bold; }
        .btn:hover { background: #005999; }
        pre { background: #111; padding: 15px; border-radius: 5px; color: #fff; }
    </style>
</head>
<body>
    <h1>🚀 초고속 AOT 언어 플레이그라운드</h1>
    <p>LaTeX 수식과 Math 연산을 작성하고 바로 번역된 결과를 받아보세요.</p>
    
    <!-- 코드 입력창 -->
    <textarea id="code" placeholder="코드를 입력하세요...">
let x = Math.\sqrt{16} + 10;
Math.\frac{x}{2};
    </textarea>
    <br><br>

    <button class="btn" onclick="runCode()">실행하기 (초고속 결과)</button>
    <button class="btn" style="background:#28a745;" onclick="downloadBinary()">최적화 바이너리 파일 다운로드</button>

    <h3>실행 결과 / 최적화된 기계어 정보:</h3>
    <pre id="output">버튼을 누르면 AOT 컴파일 결과가 여기에 표시됩니다.</pre>

    <script>
        async function runCode() {
            const userCode = document.getElementById('code').value;
            document.getElementById('output').innerText = "컴파일 및 최적화 중...";
            
            // 컴파일 서버로 코드 전송
            const response = await fetch('https://내-컴파일-서버.com/api/compile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: userCode })
            });
            const result = await response.json();
            document.getElementById('output').innerText = result.output;
        }

        function downloadBinary() {
            alert("컴파일된 고속 실행 파일(.exe / .bin)을 다운로드합니다.");
            window.location.href = "https://내-컴파일-서버.com/api/download";
        }
    </script>
</body>
</html>
